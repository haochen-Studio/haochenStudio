<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昊宸工作室官方网站-首页</title>
<link rel="icon" type="image/png" href="img/ico.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5f7fa;
    color: #333;
    min-width: 1100px;
  }
  a { text-decoration: none; color: inherit; }
  ul, li { list-style: none; }
  .container { width: 1000px; margin: 0 auto; }

  /* ============ 顶部 ============ */
  .site-header {
    background:
      linear-gradient(180deg, rgba(243,249,255,.92) 0%, rgba(226,240,253,.55) 100%),
      url("https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=light%20blue%20sky%20with%20white%20silhouette%20of%20modern%20city%20skyline%20at%20the%20bottom%2C%20minimal%20clean%20corporate%20website%20header%20background%2C%20soft%20pale%20blue%20gradient%2C%20no%20text&image_size=landscape_16_9") center bottom / cover no-repeat;
  }
  .header-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 92px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-text h1 {
    font-size: 27px; color: #1a5cb0; letter-spacing: 2px; font-weight: 700;
  }
  .brand-text p {
    font-size: 11px; color: #4a7fbe; letter-spacing: .5px; margin-top: 4px;
  }
  .search-box { display: flex; }
  .search-box input {
    width: 200px; height: 36px; border: 1px solid #bcd2ec; border-right: none;
    background: #fff; padding: 0 12px; font-size: 13px; outline: none; color: #555;
  }
  .search-box input::placeholder { color: #a9bdd8; }
  .search-box button {
    width: 68px; height: 36px; border: none; cursor: pointer;
    background: linear-gradient(180deg, #3a7bd0, #1e5cb0);
    color: #fff; font-size: 14px; letter-spacing: 2px;
  }
  .search-box button:hover { background: linear-gradient(180deg,#2f6fbe,#1a529e); }
  .header-right { display: flex; align-items: center; gap: 18px; }
  .auth-area { display: flex; align-items: center; gap: 10px; }
  .auth-btn {
    display: inline-block; padding: 8px 18px; font-size: 13px; line-height: 1;
    border: 1px solid #bcd2ec; color: #2563b8; border-radius: 3px;
    transition: all .2s;
  }
  .auth-btn:hover { background: #f4f9ff; }
  .auth-btn.primary { background: linear-gradient(180deg,#3a7bd0,#1e5cb0); color: #fff; border-color: transparent; }
  .auth-btn.primary:hover { background: linear-gradient(180deg,#2f6fbe,#1a529e); }
  .auth-user { font-size: 14px; color: #1a5cb0; }
  .auth-user b { font-weight: 700; }
  .auth-logout { font-size: 13px; color: #8a97a8; cursor: pointer; text-decoration: none; }
  .auth-logout:hover { color: #d0342c; }

  /* ============ 导航 ============ */
  .main-nav {
    background: linear-gradient(180deg, #2f74ce, #1c56a8);
    box-shadow: 0 2px 6px rgba(20,60,120,.25);
    position: relative; z-index: 5;
  }
  .main-nav ul { display: flex; }
  .main-nav li { flex: 1; text-align: center; position: relative; }
  .main-nav a {
    display: block; color: #fff; font-size: 16px; letter-spacing: 1px;
    padding: 15px 0; transition: background .2s;
  }
  .main-nav li + li::before {
    content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 1px; height: 18px; background: rgba(255,255,255,.25);
  }
  .main-nav li:hover a, .main-nav li.on a { background: rgba(12,45,95,.28); font-weight: 700; }

  /* ============ 横幅 ============ */
  .hero {
    height: 330px;
    background: url("https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=deep%20navy%20blue%20technology%20background%2C%20glowing%20golden%20and%20blue%20light%20beams%2C%20abstract%20digital%20particles%20and%20bokeh%20lights%2C%20city%20skyline%20silhouette%2C%20futuristic%20corporate%20banner%2C%20cinematic%2C%20no%20text&image_size=landscape_16_9") center / cover no-repeat;
    display: flex; align-items: center; justify-content: center;
  }
  .hero-content { text-align: center; transform: translateY(-6px); }
  .hero h2 {
    color: #fff; font-size: 42px; font-weight: 700; letter-spacing: 4px;
    text-shadow: 0 3px 12px rgba(0,20,60,.6);
  }
  .hero h2 .gold { color: #ffd75e; }
  .hero-badge {
    display: inline-block; margin-top: 24px; padding: 10px 34px;
    background: rgba(35,90,175,.55); border: 1px solid rgba(255,255,255,.18);
    color: #fff; font-size: 18px; letter-spacing: 5px;
  }

  /* ============ 服务导航 ============ */
  .services-wrap { margin-top: 26px; }
  .services {
    display: flex; background: #fff; border: 1px solid #e4eaf3;
    box-shadow: 0 3px 10px rgba(30,70,140,.06);
  }
  .service-grid {
    flex: 1; display: grid; grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
  }
  .service-item {
    display: flex; align-items: center; gap: 12px; padding: 20px 18px;
    border-right: 1px solid #edf1f7; border-bottom: 1px solid #edf1f7;
    transition: background .2s; cursor: pointer;
  }
  .service-item:nth-child(3n) { border-right: none; }
  .service-item:nth-child(n+4) { border-bottom: none; }
  .service-item:hover { background: #f4f9ff; }
  .service-item svg { width: 36px; height: 36px; flex-shrink: 0; }
  .service-item span { font-size: 14px; color: #444; line-height: 1.5; transition: color .2s; }
  .service-item:hover span { color: #1e5cb0; }
  .icon-stroke { fill: none; stroke: #2563b8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-fill { fill: #2563b8; }

  .service-side {
    width: 290px; display: flex; border-left: 1px solid #edf1f7;
  }
  .side-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; padding: 16px 8px; cursor: pointer;
    transition: background .2s;
  }
  .side-item + .side-item { border-left: 1px solid #edf1f7; }
  .side-item:hover { background: #f4f9ff; }
  .side-item:hover .side-label { color: #1e5cb0; }
  .side-label { font-size: 13px; color: #444; transition: color .2s; }
gong'zugon .book-icon { width: 58px; height: 58px; }

  /* ============ 新闻区 ============ */
  .news { display: flex; gap: 24px; margin-top: 34px; padding-bottom: 50px; }
  .news-left { width: 470px; flex-shrink: 0; }
  .news-right { flex: 1; }

  .section-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    border-bottom: 2px solid #e8edf4; padding-bottom: 12px;
  }
  .section-head h3 { font-size: 20px; color: #222; font-weight: 700; letter-spacing: 1px; }
  .more { font-size: 13px; color: #2563b8; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .more:hover { color: #174a92; }
  .more .plus {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; background: #d0342c; color: #fff;
    font-size: 12px; line-height: 1; border-radius: 2px; font-weight: 700;
  }

  .pic-news { margin-top: 16px; overflow: hidden; }
  .pic-news img {
    width: 100%; height: 300px; object-fit: cover; display: block;
    transition: transform .4s;
  }
  .pic-news:hover img { transform: scale(1.04); }

  .tabs { display: flex; gap: 30px; }
  .tabs li {
    font-size: 17px; color: #777; cursor: pointer; position: relative;
    padding-bottom: 14px; margin-bottom: -14px; transition: color .2s;
  }
  .tabs li:hover { color: #1e5cb0; }
  .tabs li.on { color: #222; font-weight: 700; }
  .tabs li.on::after {
    content: ""; position: absolute; left: 50%; bottom: -2px; transform: translateX(-50%);
    width: 32px; height: 2px; background: #2563b8;
  }

  .news-list { margin-top: 6px; }
  .news-item {
    display: flex; align-items: center; padding: 15px 2px;
    border-bottom: 1px solid #eef1f6; cursor: pointer;
  }
  .news-item:hover .news-title { color: #1e5cb0; }
  .news-date { width: 66px; text-align: center; flex-shrink: 0; margin-right: 12px; }
  .news-date .d { font-size: 28px; font-weight: 700; color: #2563b8; line-height: 1.1; }
  .news-date .m { font-size: 12px; color: #9aa7b8; }
  .news-title { font-size: 15px; color: #333; line-height: 1.6; transition: color .2s; }
  .news-item:hover .news-date .d { color: #174a92; }

  /* ============ 页脚 ============ */
  .site-footer {
    background: #1c56a8; color: #cfe0f5; text-align: center;
    padding: 22px 0; font-size: 13px; line-height: 1.9;
  }
  .site-footer a { color: #fff; }
  .site-footer a:hover { text-decoration: underline; }

  /* ============ 子页面 ============ */
  [hidden] { display: none !important; }
  .sub-banner {
    height: 130px;
    background: url("https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=deep%20navy%20blue%20technology%20background%2C%20glowing%20golden%20and%20blue%20light%20beams%2C%20abstract%20digital%20particles%20and%20bokeh%20lights%2C%20city%20skyline%20silhouette%2C%20futuristic%20corporate%20banner%2C%20cinematic%2C%20no%20text&image_size=landscape_16_9") center 40% / cover no-repeat;
    display: flex; align-items: center; justify-content: center;
  }
  .sub-banner h2 {
    color: #fff; font-size: 28px; font-weight: 700; letter-spacing: 4px;
    text-shadow: 0 2px 10px rgba(0,20,60,.65);
  }
  .breadcrumb { padding: 16px 0 2px; font-size: 13px; color: #8a97a8; }
  .breadcrumb a { color: #2563b8; }
  .breadcrumb a:hover { text-decoration: underline; }
  .sub-card {
    background: #fff; border: 1px solid #e4eaf3;
    box-shadow: 0 3px 10px rgba(30,70,140,.06);
    padding: 24px 30px; margin: 12px 0 46px;
  }
  .page-title-bar {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 2px solid #e8edf4; padding-bottom: 12px; margin-bottom: 4px;
  }
  .page-title-bar h3 { font-size: 20px; color: #222; font-weight: 700; letter-spacing: 1px; }
  .count { font-size: 13px; color: #9aa7b8; }
  .news-snip { font-size: 13px; color: #8a97a8; margin-top: 4px; line-height: 1.7; }
  .page-intro p { font-size: 14px; color: #555; line-height: 2.1; margin-bottom: 6px; }
  .article-head h1 { font-size: 22px; color: #222; line-height: 1.6; }
  .article-meta { display: flex; gap: 18px; margin-top: 12px; font-size: 13px; color: #9aa7b8; }
  .article-body { margin-top: 20px; border-top: 1px dashed #e8edf4; padding-top: 20px; }
  .article-body p { font-size: 15px; color: #444; line-height: 2; margin-bottom: 12px; text-indent: 2em; }
  .article-nav { margin-top: 22px; border-top: 1px solid #eef1f6; padding-top: 14px; font-size: 13px; }
  .article-nav a { display: block; color: #555; margin-bottom: 8px; line-height: 1.8; }
  .article-nav a:hover { color: #1e5cb0; }
  .article-nav a span { color: #b3bdc9; }
  .back-btn {
    display: inline-block; margin-top: 14px; padding: 8px 24px;
    border: 1px solid #bcd2ec; color: #2563b8; font-size: 13px;
    border-radius: 3px; transition: all .2s;
  }
  .back-btn:hover { background: #f4f9ff; }
  mark { background: #fff3bf; color: #c0392b; padding: 0 1px; }
  .no-result { text-align: center; color: #9aa7b8; padding: 36px 0; font-size: 14px; line-height: 2; }
  .svc-head { border-bottom: 2px solid #e8edf4; padding-bottom: 16px; }
  .svc-head h3 { font-size: 20px; color: #222; padding-left: 12px; border-left: 4px solid #2563b8; }
  .svc-body p { font-size: 14px; color: #555; line-height: 2.1; margin-top: 16px; }
  .contact-list { margin-top: 18px; border-top: 1px dashed #e8edf4; padding-top: 8px; }
  .contact-list li { font-size: 14px; color: #555; line-height: 2.4; }
  .contact-list b { color: #2563b8; }

  /* ============ 用户中心 + 论坛 ============ */
  .auth-avatar-wrap { position: relative; display: flex; align-items: center; gap: 8px; }
  .auth-avatar { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 2px solid #bcd2ec; object-fit: cover; }
  .auth-avatar-name { font-size: 14px; color: #1a5cb0; font-weight: 700; cursor: pointer; }
  .avatar-menu {
    position: absolute; top: 48px; right: 0; width: 140px; background: #fff;
    border: 1px solid #e4eaf3; border-radius: 4px;
    box-shadow: 0 6px 18px rgba(30,70,140,.18); z-index: 99; overflow: hidden;
  }
  .avatar-menu a { display: block; padding: 10px 16px; font-size: 13px; color: #444; cursor: pointer; }
  .avatar-menu a:hover { background: #f4f9ff; color: #1e5cb0; }
  .hc-btn {
    display: inline-block; padding: 9px 28px; border: none; cursor: pointer;
    background: linear-gradient(180deg,#3a7bd0,#1e5cb0); color: #fff;
    font-size: 14px; border-radius: 3px; letter-spacing: 1px;
  }
  .hc-btn:hover { background: linear-gradient(180deg,#2f6fbe,#1a529e); }
  .hc-btn.on { background: #e8edf4; color: #2563b8; }
  .post-form input[type="text"], .settings-form input[type="text"] {
    width: 100%; height: 38px; border: 1px solid #d4dfee; padding: 0 12px;
    font-size: 14px; outline: none; color: #333; margin-top: 14px;
  }
  .post-form textarea, .settings-form textarea {
    width: 100%; border: 1px solid #d4dfee; padding: 10px 12px; font-size: 14px;
    outline: none; color: #333; margin-top: 12px; resize: vertical; font-family: inherit;
  }
  .post-form input:focus, .post-form textarea:focus,
  .settings-form input:focus, .settings-form textarea:focus { border-color: #2563b8; }
  .post-form .hc-btn { margin-top: 12px; }
  .post-item { border-bottom: 1px solid #eef1f6; padding: 16px 2px; }
  .post-title { font-size: 16px; font-weight: 700; color: #222; line-height: 1.6; }
  .post-link:hover { color: #1e5cb0; }
  .post-content {
    font-size: 14px; color: #555; line-height: 1.8; margin-top: 6px;
    max-height: 66px; overflow: hidden; word-break: break-all; white-space: pre-wrap;
  }
  .post-meta { display: flex; gap: 16px; align-items: center; margin-top: 10px; font-size: 13px; color: #9aa7b8; }
  .post-author { color: #2563b8; }
  .post-author:hover { text-decoration: underline; }
  .like-btn { cursor: pointer; user-select: none; }
  .like-btn.liked { color: #d0342c; }
  .like-btn i { font-style: normal; }
  .del-btn { cursor: pointer; color: #d0342c; }
  .del-btn:hover { text-decoration: underline; }
  .user-head { display: flex; gap: 20px; align-items: center; }
  .user-avatar { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #bcd2ec; object-fit: cover; flex-shrink: 0; }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 20px; font-weight: 700; color: #222; }
  .user-name .hc-link { font-size: 13px; font-weight: 400; color: #2563b8; margin-left: 10px; }
  .user-name .hc-link:hover { text-decoration: underline; }
  .user-email { font-size: 13px; color: #9aa7b8; margin-top: 4px; }
  .user-bio { font-size: 14px; color: #555; margin-top: 8px; line-height: 1.7; }
  .user-meta { font-size: 13px; color: #9aa7b8; margin-top: 8px; }
  .follow-btn { flex-shrink: 0; }
  .settings-form label { display: block; font-size: 14px; color: #444; margin-top: 16px; }
  .settings-form .form-row { margin-bottom: 4px; }
  .bio-count { font-size: 12px; color: #9aa7b8; text-align: right; margin-top: 4px; }
  .settings-form .hc-btn { margin-top: 14px; }
  .user-result-item {
    display: flex; align-items: center; gap: 12px; padding: 14px 2px;
    border-bottom: 1px solid #eef1f6; cursor: pointer;
  }
  .user-result-item:hover .ur-name { color: #1e5cb0; }
  .ur-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #bcd2ec; object-fit: cover; flex-shrink: 0; }
  .ur-info { flex: 1; min-width: 0; }
  .ur-name { font-size: 15px; font-weight: 700; color: #333; }
  .ur-bio { font-size: 13px; color: #8a97a8; margin-top: 2px; }
  .ur-fans { font-size: 13px; color: #9aa7b8; flex-shrink: 0; }

  /* ============ 响应式 ============ */
  @media (max-width: 1040px) {
    body { min-width: 0; }
    .container { width: auto; padding: 0 14px; }
    .news { flex-direction: column; }
    .news-left { width: 100%; }
    .service-grid { grid-template-columns: repeat(2, 1fr); }
    .service-item:nth-child(3n) { border-right: 1px solid #edf1f7; }
    .service-item:nth-child(2n) { border-right: none; }
    .service-item:nth-child(n+4) { border-bottom: 1px solid #edf1f7; }
    .service-side { display: none; }
    .hero h2 { font-size: 30px; }
  }

  /* ============ hc- 新增功能样式 ============ */
  .hc-announce { background: #fff6d6; border-bottom: 1px solid #e3cf8e; color: #6e5310; font-size: 13px; }
  .hc-announce-inner { padding: 8px 0; line-height: 1.6; }
  .hc-vbadge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; border-radius: 50%; color: #fff;
    font-size: 10px; font-weight: 700; line-height: 1; margin-left: 4px;
    vertical-align: 2px; font-style: normal;
  }
  .hc-vtitle { font-size: 12px; color: #b8870b; margin-top: 3px; }
  .hc-btn2 {
    display: inline-block; padding: 9px 22px; border: 1px solid #bcd2ec; cursor: pointer;
    background: #fff; color: #2563b8; font-size: 14px; border-radius: 3px;
  }
  .hc-btn2:hover { background: #f4f9ff; }
  .hc-btn-sm { padding: 5px 14px; font-size: 13px; }
  .hc-modal-mask {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15,35,70,.45); z-index: 999;
    display: flex; align-items: center; justify-content: center;
  }
  .hc-dialog { width: 420px; background: #fff; border-radius: 6px; box-shadow: 0 10px 40px rgba(10,40,90,.3); padding: 22px 26px; }
  .hc-dialog h3 { font-size: 17px; color: #222; border-bottom: 2px solid #e8edf4; padding-bottom: 10px; }
  .hc-dialog label { display: block; font-size: 13px; color: #444; margin-top: 14px; }
  .hc-dialog select, .hc-dialog input[type="text"], .hc-dialog textarea {
    width: 100%; border: 1px solid #d4dfee; padding: 8px 10px; font-size: 13px; outline: none;
    margin-top: 6px; font-family: inherit; border-radius: 3px; background: #fff;
  }
  .hc-dialog select:focus, .hc-dialog input:focus, .hc-dialog textarea:focus { border-color: #2563b8; }
  .hc-dialog-btns { margin-top: 18px; text-align: right; }
  .hc-dialog-btns .hc-btn2 { margin-right: 10px; }
  .hc-member-top { display: flex; gap: 24px; margin-top: 16px; }
  .hc-coin-card { flex: 1; text-align: center; padding: 24px 0; background: linear-gradient(180deg,#fff9e6,#fff3cf); border: 1px solid #eed88f; border-radius: 6px; }
  .hc-coin-num { font-size: 38px; font-weight: 700; color: #d99a00; line-height: 1.2; }
  .hc-coin-label { font-size: 13px; color: #8a6d1f; margin-top: 6px; }
  .hc-verify-card { flex: 1; padding: 20px 24px; background: #f7faff; border: 1px solid #dbe7f7; border-radius: 6px; }
  .hc-verify-card h4 { font-size: 14px; color: #444; }
  .hc-verify-now { display: block; margin-top: 14px; font-size: 16px; color: #222; font-weight: 700; }
  .hc-stats { display: flex; gap: 24px; margin-top: 24px; }
  .hc-stat { flex: 1; text-align: center; border: 1px solid #e4eaf3; border-radius: 6px; padding: 16px 0; }
  .hc-stat b { font-size: 26px; color: #1e5cb0; }
  .hc-stat span { display: block; font-size: 13px; color: #8a97a8; margin-top: 4px; }
  .hc-ach-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 16px; }
  .hc-ach { border: 1px solid #e4eaf3; border-radius: 6px; padding: 16px 12px; text-align: center; }
  .hc-ach .hc-ach-name { font-size: 14px; font-weight: 700; color: #333; }
  .hc-ach .hc-ach-desc { font-size: 12px; color: #8a97a8; margin-top: 6px; line-height: 1.6; min-height: 38px; }
  .hc-ach .hc-ach-coin { font-size: 12px; color: #d99a00; margin-top: 6px; }
  .hc-ach.hc-ach-got { background: linear-gradient(180deg,#fff9e6,#ffefc2); border-color: #eed88f; }
  .hc-ach.hc-ach-got .hc-ach-name { color: #b8870b; }
  .hc-ach.hc-ach-lock { background: #f4f6f9; }

  // ===== 工具 =====
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function hl(text, kw) {
    var t = esc(text);
    if (!kw) return t;
    var re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    return t.replace(re, '<mark>$&</mark>');
  }
  function byCat(cat) {
    return ARTICLES.filter(function (a) { return a.cat === cat && !hcIsHidden(a); })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  }
  function rowHtml(a, kw, snip) {
    var p = a.date.split('-');
    return '<li><a class="news-item" href="#/article/' + a.id + '">' +
             '<div class="news-date"><div class="d">' + p[2] + '</div><div class="m">' + p[0] + '-' + p[1] + '</div></div>' +
             '<div><div class="news-title">' + hl(a.title, kw) + '</div>' +
             (snip ? '<div class="news-snip">' + hl(snip, kw) + '</div>' : '') + '</div>' +
           '</a></li>';
  }
  function crumbHtml(items) {
    return items.map(function (it) {
      return it.href ? '<a href="' + it.href + '">' + esc(it.name) + '</a>' : esc(it.name);
    }).join(' &gt; ');
  }

      '<li><b>地址：</b>四川省成都市××路××号</li>' +
      '<li><b>电话：</b>028-88888888</li>' +

      '<li><b>工作时间：</b>周一至周五 9:00 - 17:30</li></ul>';

    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +

  // ===== hc- 新增：新闻状态整合（下架 + 自定义新闻） =====
  var hiddenNews = [];
  function hcIsHidden(a) {
    if (hiddenNews.indexOf(String(a.id)) !== -1) return true;
    if (a._nid !== undefined && hiddenNews.indexOf(String(a._nid)) !== -1) return true;
    return false;
  }
  function applyNewsState(d) {
    hiddenNews = (d.hidden || []).map(function (x) { return String(x); });
    (d.custom || []).forEach(function (c) {
      var sid = 'c' + c.id;
      var art = {
        id: sid, _nid: +c.id, cat: c.cat, date: c.date, title: c.title,
        body: Object.prototype.toString.call(c.body) === '[object Array]'
          ? c.body
          : String(c.body || '').split(/\n+/).filter(function (s) { return s.trim(); })
      };
      for (var i = 0; i < ARTICLES.length; i++) {
        if (String(ARTICLES[i].id) === sid) { ARTICLES[i] = art; return; }
      }
      ARTICLES.push(art);
    });
  }

  function searchBody(kw) {
    if (!kw) return '<div class="sub-card"><div class="no-result">请输入搜索关键词</div></div>';
    var low = kw.toLowerCase();
    var res = ARTICLES.filter(function (a) {
      return (a.title + a.body.join('')).toLowerCase().indexOf(low) > -1;
    });
    var rows = res.map(function (a) {
      var text = a.title + '　' + a.body.join('');
      var pos = text.toLowerCase().indexOf(low);
      var start = Math.max(0, pos - 30);
      var snip = (start > 0 ? '…' : '') + text.slice(start, pos + kw.length + 60).trim() + '…';
      return rowHtml(a, kw, snip);
    });
    return '<div class="sub-card"><div class="page-title-bar"><h3>搜索结果</h3>' +
      '<span class="count">关键词“' + esc(kw) + '”，共 ' + res.length + ' 条</span></div><div class="news-list">' +
      (rows.length ? rows.join('') : '<div class="no-result">未找到与“' + esc(kw) + '”相关的内容，换个关键词试试吧</div>') +
      '</div></div>' +
      '<div class="sub-card"><div class="page-title-bar"><h3>相关用户</h3></div>' +
      '<div id="userResults"><div class="no-result">加载中…</div></div></div>';

  function hcRepliesHtml(replies) {

  function hcLoadReplies(pid) {
    var list = document.getElementById('hcReplyList' + pid);
    if (!list) return;
    fetch('api.php?action=replies&post_id=' + encodeURIComponent(pid))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var list2 = document.getElementById('hcReplyList' + pid);
        if (!list2) return;
        if (d.error) { list2.innerHTML = '<div class="no-result">' + esc(d.error) + '</div>'; return; }
        var replies = d.replies || [];
        list2.innerHTML = replies.length
          ? hcRepliesHtml(replies)
          : '<div class="no-result" style="padding:14px 0">还没有回复，来抢沙发吧</div>';
        var area = list2.closest('.hc-reply-area');
        var btn = area && area.parentNode ? area.parentNode.querySelector('.hc-reply-btn') : null;
        if (btn) {
          btn.dataset.count = replies.length;
          var c = btn.querySelector('.hc-reply-count');
          if (c) c.textContent = replies.length;
        }
      })
      .catch(function () {});

  function postItemHtml(p) {
    var rc = p.reply_count || 0;
    var replyBox = meUser
      ? '<div class="hc-reply-input-row">' +
          '<input type="text" class="hc-reply-input" id="hcReplyInput' + p.id + '" maxlength="200" placeholder="写下你的回复（1-200 字）">' +
          '<button class="hc-btn hc-reply-send" data-id="' + p.id + '">发送</button>' +
        '</div>'
      : '<a class="hc-reply-login" href="login.html">登录后可回复</a>';
    return '<div class="post-item">' +
      '<div class="post-title">' + esc(p.title) + '</div>' +
      '<div class="post-content">' + esc(p.content) + '</div>' +
      '<div class="post-meta">' +
        '<a class="post-author" href="#/user/' + p.author_id + '">' + esc(p.author_name) + hcBadge(p.verify_type) + '</a>' +
        '<span>' + fmtTime(p.created_at) + '</span>' +
        '<span class="like-btn' + (p.liked ? ' liked' : '') + '" data-id="' + p.id + '">❤ <i>' + p.like_count + '</i></span>' +
        '<span class="hc-reply-btn" data-id="' + p.id + '" data-count="' + rc + '">回复(<i class="hc-reply-count">' + rc + '</i>)</span>' +
        (p.is_own ? '<span class="del-btn" data-id="' + p.id + '">删除</span>' : '') +
      '</div>' +

  function loadForum() {
    var box = document.getElementById('postList');
    if (!box) return;
    fetch('api.php?action=posts').then(function (r) { return r.json(); }).then(function (d) {
      var list = document.getElementById('postList');
      if (!list) return;
      var posts = d.posts || [];
      list.innerHTML = posts.length
        ? posts.map(postItemHtml).join('')
        : '<div class="no-result">还没有帖子，来发第一帖吧</div>';
    });
    var btn = document.getElementById('postBtn');
    if (btn) {
      btn.addEventListener('click', function () {
        var errEl = document.getElementById('postFormError');
        function showPostError(msg) {
          if (errEl) { errEl.textContent = msg; errEl.hidden = false; }
        }
        function clearPostError() {
          if (errEl) { errEl.textContent = ''; errEl.hidden = true; }
        }
        clearPostError();
        var title = document.getElementById('postTitle').value.trim();
        var content = document.getElementById('postContent').value.trim();
        if (!title) { showPostError('请输入帖子标题'); return; }
        if (!content) { showPostError('请输入帖子内容'); return; }
        fetch('api.php?action=post_create', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: title, content: content })
        }).then(function (r) {
          return r.json().then(function (d) { return { status: r.status, d: d }; });
        }).then(function (res) {
          if (res.status !== 200 || !res.d.ok) { showPostError(res.d.error || '发布失败'); return; }
          clearPostError();
          document.getElementById('postTitle').value = '';
          document.getElementById('postContent').value = '';
          loadForum();
        });
      });
    }
    box.addEventListener('click', function (e) {
      var t = e.target;
      if (t.tagName === 'I') t = t.parentNode;
      if (t.classList.contains('like-btn')) {
        if (!meUser) { alert('请先登录'); return; }
        fetch('api.php?action=post_like', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: +t.dataset.id })
        }).then(function (r) { return r.json(); }).then(function (d) {
          if (d.error) { alert(d.error); return; }
          t.classList.toggle('liked', d.liked);
          t.querySelector('i').textContent = d.like_count;
        });
      } else if (t.classList.contains('del-btn')) {
        if (!confirm('确定删除这条帖子吗？')) return;
        fetch('api.php?action=post_delete', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: +t.dataset.id })
        }).then(function (r) {
          return r.json().then(function (d) { return { status: r.status, d: d }; });
        }).then(function (res) {
          if (res.status !== 200) { alert(res.d.error || '删除失败'); return; }
          loadForum();
        });
      } else if (t.classList.contains('hc-reply-btn')) {
        var rpid = t.dataset.id;
        var area = document.getElementById('hcReplyArea' + rpid);
        if (!area) return;
        if (area.hidden) {
          area.hidden = false;
          t.classList.add('on');
          t.textContent = '收起';
          hcLoadReplies(rpid);
        } else {
          area.hidden = true;
          t.classList.remove('on');
          var n = t.dataset.count !== undefined ? +t.dataset.count : 0;
          t.innerHTML = '回复(<i class="hc-reply-count">' + n + '</i>)';
        }
      } else if (t.classList.contains('hc-reply-send')) {
        var spid = t.dataset.id;
        var sinp = document.getElementById('hcReplyInput' + spid);
        var serr = document.getElementById('hcReplyErr' + spid);
        if (serr) { serr.textContent = ''; serr.hidden = true; }
        var rcontent = sinp ? sinp.value.trim() : '';
        if (!rcontent) {
          if (serr) { serr.textContent = '回复内容不能为空'; serr.hidden = false; }
          return;
        }
        fetch('api.php?action=reply_create', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ post_id: +spid, content: rcontent })
        }).then(function (r) {
          return r.json().then(function (d) { return { status: r.status, d: d }; });
        }).then(function (res) {
          var errEl = document.getElementById('hcReplyErr' + spid);
          if (res.status !== 200 || !res.d.ok) {
            if (errEl) { errEl.textContent = res.d.error || '回复失败'; errEl.hidden = false; }
            return;
          }
          var inpEl = document.getElementById('hcReplyInput' + spid);
          if (inpEl) inpEl.value = '';
          if (errEl) { errEl.textContent = ''; errEl.hidden = true; }
          hcLoadReplies(spid);
        });
      } else if (t.classList.contains('hc-reply-del')) {
        if (!confirm('确定删除这条回复吗？')) return;
        var delWrap = t.closest('.hc-reply-area');
        var dpid = delWrap ? delWrap.id.replace('hcReplyArea', '') : '';
        fetch('api.php?action=reply_delete', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: +t.dataset.id })
        }).then(function (r) {
          return r.json().then(function (d) { return { status: r.status, d: d }; });
        }).then(function (res) {
          if (res.status !== 200 || !res.d.ok) { alert(res.d.error || '删除失败'); return; }
          if (dpid) hcLoadReplies(dpid);
        });
      }
    });
  }

    if (hcUnreadTimer) { clearInterval(hcUnreadTimer); hcUnreadTimer = null; }

    hcFetchUnread();
    hcUnreadTimer = setInterval(hcFetchUnread, 30000);

          }).join('') + '</table>' : '<div class="no-result">暂无认证申请</div>';
        body.onclick = function (e) {
          var t = e.target;
          if (!t.dataset || !t.dataset.id) return;
          fetch('api.php?action=verify_review', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: +t.dataset.id, approve: t.dataset.ok === '1' })
          }).then(function (r) { return r.json(); }).then(function (dd) {
            if (dd.error) { alert(dd.error); return; }
            hcAdminTab('verify');
          });
        };
      });
    } else if (tab === 'users') {
      fetch('api.php?action=admin_users').then(function (r) { return r.json(); }).then(function (d) {
        if (!document.getElementById('hcAdminBody')) return;
        var users = d.users || [];
        body.innerHTML = users.length ? '<table class="hc-table"><tr><th>ID</th><th>名字</th><th>邮箱</th><th>昊宸币</th><th>粉丝</th><th>认证</th><th>状态</th><th>操作</th></tr>' +
          users.map(function (u) {
            var isAdm = u.is_admin ? 1 : 0;
            var isRoot = String(u.email || '').toLowerCase() === 'haochen-gongzuoshi@qq.com';
            return '<tr' + (u.banned ? ' class="hc-off"' : '') + '><td>' + u.id + '</td><td>' + esc(u.name) +
              (isAdm ? ' <span class="hc-admin-tag">管理员</span>' : '') + '</td>' +
              '<td>' + esc(u.email) + '</td><td>' + (u.coins || 0) + '</td><td>' + (u.followers || 0) + '</td>' +
              '<td>' + (u.verify_type ? (tnames[u.verify_type] || u.verify_type) + ' ' + esc(u.verify_title || '') : '—') + '</td>' +
              '<td>' + (u.banned ? '已封禁' : '正常') + '</td>' +
              '<td><span class="hc-link-btn hc-edit-user" data-id="' + u.id + '">编辑</span>' +
                (!isRoot ? ' · <span class="hc-link-btn hc-toggle-admin" data-id="' + u.id + '" data-adm="' + isAdm + '">' +
                  (isAdm ? '取消管理员' : '设为管理员') + '</span>' : '') +
              '</td></tr>' +
              '<tr class="hc-edit-row" id="hcEditRow' + u.id + '" hidden><td colspan="8"><div class="hc-mini-form">' +
                '<label>名字</label><input type="text" id="hcEU-name-' + u.id + '" value="' + escq(u.name) + '">' +
                '<label>简介</label><input type="text" id="hcEU-bio-' + u.id + '" value="' + escq(u.bio || '') + '" style="width:170px">' +
                '<label>昊宸币</label><input type="text" id="hcEU-coins-' + u.id + '" value="' + (u.coins || 0) + '" style="width:70px">' +
                '<label>粉丝</label><input type="text" id="hcEU-fans-' + u.id + '" value="' + (u.followers || 0) + '" style="width:70px">' +
                '<label>认证</label><select id="hcEU-vt-' + u.id + '">' +
                  '<option value=""' + (u.verify_type ? '' : ' selected') + '>无</option>' +
                  '<option value="blue"' + (u.verify_type === 'blue' ? ' selected' : '') + '>蓝V</option>' +
                  '<option value="yellow"' + (u.verify_type === 'yellow' ? ' selected' : '') + '>黄V</option>' +
                  '<option value="white"' + (u.verify_type === 'white' ? ' selected' : '') + '>白V</option>' +
                '</select>' +
                '<label>称号</label><input type="text" id="hcEU-vtitle-' + u.id + '" value="' + escq(u.verify_title || '') + '">' +
                '<label>封禁</label><input type="checkbox" id="hcEU-banned-' + u.id + '"' + (u.banned ? ' checked' : '') + '>' +
                ' <button class="hc-btn hc-btn-sm hc-save-user" data-id="' + u.id + '">保存</button>' +
              '</div></td></tr>';
          }).join('') + '</table>' : '<div class="no-result">暂无用户</div>';
        body.onclick = function (e) {
          var t = e.target;
          if (t.classList.contains('hc-edit-user')) {
            var row = document.getElementById('hcEditRow' + t.dataset.id);
            if (row) row.hidden = !row.hidden;
          } else if (t.classList.contains('hc-toggle-admin')) {
            var uid = t.dataset.id;
            fetch('api.php?action=admin_update_user', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: +uid, is_admin: t.dataset.adm === '1' ? 0 : 1 })
            }).then(function (r) { return r.json(); }).then(function (dd) {
              if (dd.error) { alert(dd.error); return; }
              hcAdminTab('users');
            });
          } else if (t.classList.contains('hc-save-user')) {
            var id = t.dataset.id;
            fetch('api.php?action=admin_update_user', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                id: +id,
                name: document.getElementById('hcEU-name-' + id).value.trim(),
                bio: document.getElementById('hcEU-bio-' + id).value.trim(),
                coins: +document.getElementById('hcEU-coins-' + id).value || 0,
                followers: +document.getElementById('hcEU-fans-' + id).value || 0,
                verify_type: document.getElementById('hcEU-vt-' + id).value,
                verify_title: document.getElementById('hcEU-vtitle-' + id).value.trim(),
                banned: document.getElementById('hcEU-banned-' + id).checked ? 1 : 0
              })
            }).then(function (r) { return r.json(); }).then(function (dd) {
              if (dd.error) { alert(dd.error); return; }
              alert('已保存');
              hcAdminTab('users');
            });
          }
        };
      });
    } else if (tab === 'posts') {
      fetch('api.php?action=posts').then(function (r) { return r.json(); }).then(function (d) {
        if (!document.getElementById('hcAdminBody')) return;
        var posts = d.posts || [];
        body.innerHTML = posts.length ? posts.map(function (p) {
          return '<div class="post-item"><div class="post-title">' + esc(p.title) + '</div>' +
            '<div class="post-meta"><span>' + esc(p.author_name) + '</span>' +
            '<span>' + fmtTime(p.created_at) + '</span><span>❤ ' + p.like_count + '</span>' +
            '<span class="del-btn" data-id="' + p.id + '">删除</span></div></div>';
        }).join('') : '<div class="no-result">暂无帖子</div>';
        body.onclick = function (e) {
          var t = e.target;
          if (!t.classList.contains('del-btn')) return;
          if (!confirm('确定删除这条帖子吗？')) return;
          fetch('api.php?action=post_delete', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: +t.dataset.id })
          }).then(function (r) { return r.json(); }).then(function (dd) {
            if (dd.error) { alert(dd.error); return; }
            hcAdminTab('posts');
          });
        };
      });
    } else if (tab === 'news') {
      var rows = ARTICLES.map(function (a) {
        var sid = String(a.id);
        var off = hcIsHidden(a);
        var isCustom = sid.charAt(0) === 'c';
        return '<tr' + (off ? ' class="hc-off"' : '') + '><td>' + esc(sid) + '</td><td>' + esc(a.title) + '</td>' +
          '<td>' + (CATS[a.cat] || esc(a.cat)) + '</td><td>' + esc(a.date) + '</td>' +
          '<td>' + (off ? '已下架 ' : '') +
          '<span class="hc-link-btn hc-news-toggle" data-id="' + esc(sid) + '" data-hide="' + (off ? '0' : '1') + '">' +
            (off ? '上架' : '下架') + '</span>' +
          (isCustom ? ' · <span class="hc-danger hc-news-del" data-id="' + esc(sid) + '">删除</span>' : '') +
          '</td></tr>';
      }).join('');
      var now = new Date();
      function pd(n) { return n < 10 ? '0' + n : '' + n; }
      var today = now.getFullYear() + '-' + pd(now.getMonth() + 1) + '-' + pd(now.getDate());
      body.innerHTML = '<table class="hc-table"><tr><th>ID</th><th>标题</th><th>栏目</th><th>日期</th><th>操作</th></tr>' +
        (rows || '<tr><td colspan="5">暂无新闻</td></tr>') + '</table>' +
        '<div style="margin-top:22px;border-top:1px dashed #e8edf4;padding-top:16px">' +
          '<h4 style="font-size:15px;color:#222">发布新闻</h4>' +
          '<div class="hc-mini-form" style="margin-top:10px">' +
            '<label>栏目</label><select id="hcNewsCat">' +
              '<option value="industry">行业资讯</option><option value="pic">图片新闻</option><option value="rules">制度规则</option>' +
            '</select>' +
            '<label>日期</label><input type="text" id="hcNewsDate" value="' + today + '" style="width:110px">' +
            '<div style="margin-top:8px"><input type="text" id="hcNewsTitle" placeholder="新闻标题" style="width:100%"></div>' +
            '<div style="margin-top:8px"><textarea id="hcNewsBody" rows="5" placeholder="新闻正文（每段一行）" ' +
              'style="width:100%;border:1px solid #d4dfee;padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical"></textarea></div>' +
            '<div style="margin-top:10px"><button class="hc-btn" id="hcNewsAdd">发布</button></div>' +
          '</div></div>';
      body.onclick = function (e) {
        var t = e.target;
        if (t.classList.contains('hc-news-toggle')) {
          var sid = t.dataset.id;
          var hide = t.dataset.hide === '1';
          var nid = sid.charAt(0) === 'c' ? +sid.slice(1) : +sid;
          fetch('api.php?action=admin_news_hide', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: nid, hidden: hide ? 1 : 0 })
          }).then(function (r) { return r.json(); }).then(function (dd) {
            if (dd.error) { alert(dd.error); return; }
            var i = hiddenNews.indexOf(sid);
            if (hide && i === -1) hiddenNews.push(sid);
            if (!hide && i !== -1) hiddenNews.splice(i, 1);
            renderNews('industry');
            hcAdminTab('news');
          });
        } else if (t.classList.contains('hc-news-del')) {
          if (!confirm('确定删除这条新闻吗？')) return;
          var sid2 = t.dataset.id;
          fetch('api.php?action=admin_news_del', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: +sid2.slice(1) })
          }).then(function (r) { return r.json(); }).then(function (dd) {
            if (dd.error) { alert(dd.error); return; }
            for (var i = 0; i < ARTICLES.length; i++) {
              if (String(ARTICLES[i].id) === sid2) { ARTICLES.splice(i, 1); break; }
            }
            renderNews('industry');
            hcAdminTab('news');
          });
        } else if (t.id === 'hcNewsAdd') {
          var cat = document.getElementById('hcNewsCat').value;
          var title = document.getElementById('hcNewsTitle').value.trim();
          var nbody = document.getElementById('hcNewsBody').value.trim();
          var date = document.getElementById('hcNewsDate').value.trim();
          if (!title || !nbody || !date) { alert('请填写完整的栏目、标题、正文和日期'); return; }
          fetch('api.php?action=admin_news_add', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cat: cat, title: title, body: nbody, date: date })
          }).then(function (r) { return r.json(); }).then(function (dd) {
            if (dd.error) { alert(dd.error); return; }
            alert('发布成功');
            fetch('api.php?action=news_state').then(function (r2) { return r2.ok ? r2.json() : null; }).then(function (ns) {
              if (ns) applyNewsState(ns);
              renderNews('industry');
              hcAdminTab('news');
            });
          });
        }
      };
    }
  }

  function afterRender(seg, sub) {
    if (seg === 'forum') loadForum();
    else if (seg === 'user') loadUserPage(sub);
    else if (seg === 'myworks') loadMyWorks();
    else if (seg === 'settings') loadSettings();
    else if (seg === 'search') loadUserResults(sub);
    else if (seg === 'member') loadMember();
    else if (seg === 'messages') { loadConversations(); hcMarkRead(); }
    else if (seg === 'chat') { loadChat(sub); hcMarkRead(); }
    else if (seg === 'admin') loadAdmin('ann');
  }

  // ===== 路由 =====
  var homeEl = document.getElementById('page-home');
  var subEl = document.getElementById('page-sub');
  var navLis = document.querySelectorAll('#navList > li');

  function router() {
    var parts = location.hash.replace(/^#/, '').split('/').filter(Boolean).map(decodeURIComponent);
    var seg = parts[0] || 'home';
    var sub = parts[1] || '';
    var isHome = seg === 'home' || seg === '';
    var title = '昊宸工作室官方网站-首页';
    var banner = '', body = '', crumb = [{ name: '首页', href: '#/home' }], navIdx = -1;

    if (isHome) {
      navIdx = 0;
    } else if (seg === 'list' && CATS[sub]) {
      title = CATS[sub] + ' - 昊宸工作室官方网站';
      banner = CATS[sub];
      navIdx = sub === 'industry' ? 2 : -1;
      crumb.push({ name: CATS[sub] });
      body = listBody(sub);
    } else if (seg === 'article') {
      var a = null;
      for (var i = 0; i < ARTICLES.length; i++) if (String(ARTICLES[i].id) === String(sub)) a = ARTICLES[i];
      if (!a) {
        title = '页面不存在 - 昊宸工作室官方网站'; banner = '提示'; crumb.push({ name: '提示' }); body = notFound();
      } else {
        title = a.title + ' - 昊宸工作室官方网站';
        banner = CATS[a.cat]; navIdx = navByCat(a.cat);
        crumb.push({ name: CATS[a.cat], href: '#/list/' + a.cat }, { name: a.title });
        body = articleBody(a);
      }
    } else if (seg === 'search') {
      var kw = sub.trim();
      title = '搜索：' + kw + ' - 昊宸工作室官方网站';
      banner = '搜索结果'; crumb.push({ name: '搜索结果' });
      body = searchBody(kw);
    } else if (seg === 'page' && PAGES[sub]) {
      var pg = PAGES[sub];
      title = pg.title + ' - 昊宸工作室官方网站';
      banner = pg.title;
      navIdx = { about: 1, rules: 3 }[sub] || -1;
      crumb.push({ name: pg.title });
      body = pageBody(pg);
    } else if (seg === 'service' && SERVICES[sub]) {
      var sv = SERVICES[sub];
      title = sv.title + ' - 昊宸工作室官方网站';
      banner = '服务平台'; crumb.push({ name: sv.title });
      body = serviceBody(sv);
    } else if (seg === 'forum') {
      title = '交流论坛 - 昊宸工作室官方网站';
      banner = '交流论坛'; navIdx = 4;
      crumb.push({ name: '交流论坛' });
      body = forumBody();
    } else if (seg === 'user') {
      title = '个人主页 - 昊宸工作室官方网站';
      banner = '个人主页'; crumb.push({ name: '个人主页' });
      body = '<div id="userPageBox"><div class="no-result">加载中…</div></div>';
    } else if (seg === 'myworks') {
      title = '我的作品 - 昊宸工作室官方网站';
      banner = '我的作品'; crumb.push({ name: '我的作品' });
      body = '<div id="myworksBox"><div class="no-result">加载中…</div></div>';
    } else if (seg === 'settings') {
      title = '编辑资料 - 昊宸工作室官方网站';
      banner = '编辑资料'; crumb.push({ name: '编辑资料' });
      body = '<div id="settingsBox"><div class="no-result">加载中…</div></div>';
    } else if (seg === 'member') {
      title = '会员中心 - 昊宸工作室官方网站';
      banner = '会员中心'; crumb.push({ name: '会员中心' });
      body = '<div id="memberBox"><div class="no-result">加载中…</div></div>';
    } else if (seg === 'messages') {
      title = '消息 - 昊宸工作室官方网站';
      banner = '消息'; navIdx = 5; crumb.push({ name: '消息' });
      body = '<div id="messagesBox"><div class="no-result">加载中…</div></div>';
    } else if (seg === 'chat') {
      title = '私聊 - 昊宸工作室官方网站';
      banner = '私聊'; navIdx = 5; crumb.push({ name: '消息', href: '#/messages' }, { name: '私聊' });
      body = '<div id="chatBox"><div class="no-result">加载中…</div></div>';
    } else if (seg === 'admin') {
      title = '管理后台 - 昊宸工作室官方网站';
      banner = '管理后台'; crumb.push({ name: '管理后台' });
      body = '<div id="adminBox"><div class="no-result">加载中…</div></div>';
    } else {
      title = '页面不存在 - 昊宸工作室官方网站';
      banner = '提示'; crumb.push({ name: '提示' });
      body = notFound();
    }

    homeEl.hidden = !isHome;
    subEl.hidden = isHome;
    if (!isHome) {
      document.getElementById('sub-banner-title').textContent = banner;
      document.getElementById('sub-crumb').innerHTML = crumbHtml(crumb);
      document.getElementById('sub-view').innerHTML = body;
      afterRender(seg, sub);
    }
    document.title = title;
    navLis.forEach(function (li, i) { li.classList.toggle('on', i === navIdx); });
    loadAnnouncement();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', router);
  router();

  // ===== 首页新闻列表 =====
  var listEl = document.getElementById('newsList');

  function renderNews(key) {
    listEl.innerHTML = byCat(key).slice(0, 5).map(function (a) { return rowHtml(a); }).join('');
  }
  renderNews('industry');

  // ===== 搜索 =====
  function doSearch() {
    var kw = document.getElementById('searchInput').value.trim();
    if (!kw) { alert('请输入搜索关键词以搜索内容🔍'); return; }
    location.hash = '#/search/' + encodeURIComponent(kw);
  }
  document.getElementById('searchBtn').addEventListener('click', doSearch);
  document.getElementById('searchInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doSearch();
  });

  // ===== 登录状态 =====
  var meUser = null;
  function renderAuth(user) {
    var el = document.getElementById('authArea');
    if (!el) return;
    meUser = user || null;
    if (user) {
      el.innerHTML = '<div class="auth-avatar-wrap">' +
        '<img class="auth-avatar" id="authAvatar" src="/tx.png" alt="头像">' +
        '<span class="auth-avatar-name" id="authAvatarName">' + esc(user.name) + '</span>' +
        '<div class="avatar-menu" id="avatarMenu" hidden>' +
          '<a href="#/member">会员中心</a>' +
          '<a href="#/messages">消息</a>' +
          (user.is_admin ? '<a href="#/admin">管理后台</a>' : '') +
          '<a href="#/myworks">我的作品</a>' +
          '<a href="#/settings">编辑资料</a>' +
          '<a href="#/user/' + user.id + '">个人主页</a>' +
          '<a id="joinUsBtn">加入我们</a>' +
          '<a id="logoutBtn">退出</a>' +
        '</div></div>';
      var menu = document.getElementById('avatarMenu');
      var toggle = function (e) { e.stopPropagation(); menu.hidden = !menu.hidden; };
      document.getElementById('authAvatar').addEventListener('click', toggle);
      document.getElementById('authAvatarName').addEventListener('click', toggle);
      document.getElementById('joinUsBtn').addEventListener('click', function () {
        alert('请使用邮箱向 haochen-gongzuoshi@qq.com 发送加入邮件');
      });
      document.getElementById('logoutBtn').addEventListener('click', function () {
        fetch('api.php?action=logout', { method: 'POST' }).finally(function () { renderAuth(null); router(); });
      });
      hcStartUnreadPoll();
    } else {
      hcStopUnreadPoll();
      el.innerHTML = '<a class="auth-btn" href="login.html">登录</a>' +
        '<a class="auth-btn primary" href="register.html">注册</a>';
    }
  }
  document.addEventListener('click', function () {
    var menu = document.getElementById('avatarMenu');
    if (menu && !menu.hidden) menu.hidden = true;
  });
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    fetch('api.php?action=me')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { renderAuth(d && d.user ? d.user : null); router(); })
      .catch(function () { renderAuth(null); });
    // hc- 新增：启动时拉取新闻状态（下架 + 自定义），失败则静默只用本地 ARTICLES
    fetch('api.php?action=news_state')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return;
        applyNewsState(d);
        renderNews('industry');
        router();
      })
      .catch(function () {});
  } else {
    renderAuth(null);
  }
</script>
</body>
</html>
